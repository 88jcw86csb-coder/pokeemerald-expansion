name: Eryon terrain maps
on:
  push:
    branches: [eryon-development]
    paths:
      - 'tools/eryon_*.py'
      - 'tools/test_eryon_*.py'
      - 'docs/eryon/**/*.txt'
      - 'docs/eryon/*.md'
      - 'tools/build_eryon_map_bins.py'
      - 'tools/test_eryon_terrain_plan.py'
      - 'tools/test_eryon_map_bins.py'
      - 'docs/eryon/*_terrain_plan.txt'
      - 'data/maps/Eryon_*/map.json'
      - 'data/layouts/layouts.json'
      - 'map_data_rules.mk'
      - '.github/workflows/eryon-terrain.yml'
  workflow_dispatch:

jobs:
  verify-terrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate five registered Eryon map binaries and previews
        run: |
          python3 tools/build_eryon_map_bins.py --wall 0x3c01 --path 0x3001 --meadow 0x3002 --stone 0x3003 --preview-unregistered
      - name: Test map connectivity and encoding
        run: python3 -m unittest discover -s tools -p 'test_eryon_*py'
      - name: Audit 36-stage Eryon regional map inventory
        run: python3 tools/eryon_world_audit.py
      - name: Verify ten unregistered terrain previews
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.build_eryon_map_bins import PREVIEW_SPECS, WIDTH, HEIGHT
          for folder in PREVIEW_SPECS.values():
              path = Path("build/eryon-previews") / folder / "map.bin"
              assert path.is_file(), path
              assert path.stat().st_size == WIDTH * HEIGHT * 2, path
              print(f"{folder}: preview encoding OK")
          league = Path("build/eryon-previews/LigaEryon/map.bin")
          assert league.is_file(), league
          assert league.stat().st_size == 64 * 56 * 2, league
          print("LigaEryon: 7168-byte preview encoding OK")
          PY
      - name: Verify dimensions and layout references
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          layouts = json.loads(Path("data/layouts/layouts.json").read_text())["layouts"]
          eryon = [layout for layout in layouts if layout["id"] in {
              "LAYOUT_ERYON_BOSQUE_DE_LUMINA",
              "LAYOUT_ERYON_SERRA_DOS_CRISTAIS",
              "LAYOUT_ERYON_PASSAGEM_ROCHOSA",
              "LAYOUT_ERYON_ESTRADA_ORIENTAL",
              "LAYOUT_ERYON_VALE_DOS_VENTOS",
          }]
          assert len(eryon) == 5
          for layout in eryon:
              path = Path(layout["blockdata_filepath"])
              expected = layout["width"] * layout["height"] * 2
              assert path.is_file(), path
              assert path.stat().st_size == expected, (path, expected)
              print(f"{layout['id']}: {expected} bytes OK")
          PY
