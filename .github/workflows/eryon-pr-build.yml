name: Eryon GBA Build Verification

on:
  pull_request:
    branches:
      - eryon-development
  workflow_dispatch:

permissions:
  contents: read

env:
  GAME_VERSION: EMERALD
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  verify-eryon-gba:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'eryon-development'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout candidate Eryon commit
        uses: actions/checkout@v4

      - name: Install GBA cross-compiler and build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3 build-essential

      - name: Check build-script syntax
        run: bash -n tools/build_eryon.sh

      - name: Compile and run all Eryon regression tests
        run: |
          mkdir -p build
          set -o pipefail
          bash tools/build_eryon.sh 2>&1 | tee build/eryon-pr-ci.log

      - name: Upload diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eryon-pr-build-diagnostics
          path: |
            build/eryon-pr-ci.log
            build/eryon-build.log
            build/eryon-rom.sha256
          if-no-files-found: warn

      - name: Upload newly compiled GBA ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eryon-pr-gba
          path: |
            pokeeryon.gba
            build/eryon-rom.sha256
          if-no-files-found: error
